[package]
name = "radmobile-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
png = "0.18.1"
radmobile-core = { version = "0.5.0", path = "../radmobile-core" }
rea-launcher.workspace = true
rea-launcher-native.workspace = true

[dev-dependencies]
# theme::contrast for the menu palette test; not in the shipped binary.
rea-launcher-ui.workspace = true
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
rea-launcher-win32.workspace = true
