# Builds the release packages (patched MAME + launcher) for Linux and
# Windows. A manual run uploads them as workflow artifacts; pushing a tag
# vX.Y.Z (matching the workspace version) also publishes a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # Debian bookworm (glibc 2.36), as scripts/build-linux-portable.sh does
    # locally, so the package runs on older distributions too.
    runs-on: ubuntu-latest
    container: debian:bookworm
    timeout-minutes: 150
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential python3 \
            libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libxinerama-dev libxi-dev \
            libgl-dev pkg-config ca-certificates git curl
      - uses: actions/checkout@v5
      - name: MAME source (pinned submodule)
        run: scripts/ci/fetch-mame.sh
      - name: Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build
        run: scripts/build-linux-release.sh
      - name: Package
        run: scripts/package.sh linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/pkg/*.tar.gz
          if-no-files-found: error

  windows:
    # MinGW-w64 cross build on Arch (posix threads), like the local
    # `gaming` distrobox.
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 150
    steps:
      - name: System packages
        run: pacman -Syu --noconfirm --needed git mingw-w64-gcc lld python rustup curl
      - uses: actions/checkout@v5
      - name: MAME source (pinned submodule)
        run: scripts/ci/fetch-mame.sh
      - name: Rust
        run: rustup default stable && rustup target add x86_64-pc-windows-gnu
      - name: Build MAME
        run: scripts/build-mame.sh windows
      - name: Build launcher
        run: scripts/build-launcher.sh windows
      - name: Package
        run: scripts/package.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/pkg/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist/pkg
          merge-multiple: true
      - name: Checksums
        run: cd dist/pkg && sha256sum RadMobile-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/pkg/RadMobile-* dist/pkg/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "Rad Mobile ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/RELEASE_NOTES.md
